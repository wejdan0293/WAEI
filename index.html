<script>

/* =====================================================
   WAEI CONFIGURATION
===================================================== */

const WEBHOOK_URL =
"https://wejdansaleh0293.app.n8n.cloud/webhook/22a301d4-5843-4d63-a1fe-eff21d8a29b7";


/* =====================================================
   SESSION
===================================================== */

let sessionId =
    localStorage.getItem("waei_session_id");

if (!sessionId) {

    sessionId =
        "waei-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 9);

    localStorage.setItem(
        "waei_session_id",
        sessionId
    );
}


/* =====================================================
   STATE
===================================================== */

let selectedExposure = "received_only";
let selectedImage = null;
let waitingForFollowUp = false;


/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById("message");

const analyzeBtn =
    document.getElementById("analyzeBtn");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const results =
    document.getElementById("results");

const fileInput =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const followUp =
    document.getElementById("followUp");

const followUpQuestion =
    document.getElementById("followUpQuestion");

const followUpInput =
    document.getElementById("followUpInput");


/* =====================================================
   EXPOSURE SELECTION
===================================================== */

document
    .querySelectorAll(".exposure")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".exposure")
                    .forEach(item => {
                        item.classList.remove("active");
                    });

                card.classList.add("active");

                selectedExposure =
                    card.dataset.value;
            }
        );

    });


/* =====================================================
   IMAGE PREVIEW
===================================================== */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        selectedImage = file;

        const reader =
            new FileReader();

        reader.onload =
            event => {

                previewImage.src =
                    event.target.result;

                preview.style.display =
                    "block";
            };

        reader.readAsDataURL(file);

    }
);


/* =====================================================
   CHANNEL DETECTION
===================================================== */

function detectChannel(text) {

    const value =
        String(text || "").toLowerCase();

    if (
        value.includes("sms") ||
        value.includes("رسالة نصية") ||
        value.includes("رسالة sms")
    ) {
        return "sms";
    }

    if (
        value.includes("whatsapp") ||
        value.includes("واتساب")
    ) {
        return "whatsapp";
    }

    if (
        value.includes("email") ||
        value.includes("إيميل") ||
        value.includes("ايميل") ||
        value.includes("بريد إلكتروني") ||
        value.includes("بريد")
    ) {
        return "email";
    }

    if (
        value.includes("telegram") ||
        value.includes("تلجرام") ||
        value.includes("تيليجرام")
    ) {
        return "telegram";
    }

    if (
        value.includes("instagram") ||
        value.includes("انستقرام") ||
        value.includes("إنستقرام")
    ) {
        return "social_media";
    }

    return "unknown";
}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";
}


/* =====================================================
   RISK TRANSLATION
===================================================== */

function translateRisk(level) {

    const map = {

        low: "منخفض",

        medium: "متوسط",

        high: "مرتفع",

        critical: "حرج"

    };

    return map[level] ||
        level ||
        "غير محدد";
}


/* =====================================================
   COMPROMISE TRANSLATION
===================================================== */

function translateCompromise(status) {

    const map = {

        no_evidence:
            "لا توجد أدلة على اختراق",

        suspicious_activity:
            "نشاط مشبوه",

        possible_compromise:
            "احتمالية اختراق",

        strongly_supported_compromise:
            "مؤشرات قوية على الاختراق",

        confirmed_compromise:
            "اختراق مؤكد"

    };

    return map[status] ||
        status ||
        "غير محدد";
}


/* =====================================================
   RENDER LIST
===================================================== */

function renderList(
    element,
    items
) {

    element.innerHTML = "";

    if (
        !Array.isArray(items) ||
        items.length === 0
    ) {

        const li =
            document.createElement("li");

        li.textContent =
            "لا توجد معلومات إضافية.";

        element.appendChild(li);

        return;
    }

    items.forEach(item => {

        const li =
            document.createElement("li");

        li.textContent =
            typeof item === "string"
                ? item
                : JSON.stringify(item);

        element.appendChild(li);

    });

}


/* =====================================================
   RENDER ACTIONS
===================================================== */

function renderActions(
    element,
    items
) {

    element.innerHTML = "";

    if (
        !Array.isArray(items) ||
        items.length === 0
    ) {

        element.innerHTML = `
            <div class="action-item">
                لا توجد إجراءات إضافية.
            </div>
        `;

        return;
    }

    items.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "action-item";

        div.textContent =
            typeof item === "string"
                ? item
                : JSON.stringify(item);

        element.appendChild(div);

    });

}


/* =====================================================
   RESPONSE NORMALIZATION
===================================================== */

function normalizeResponse(data) {

    if (!data) {
        return {};
    }


    /* إذا كانت الاستجابة نصاً */

    if (typeof data === "string") {

        try {

            return JSON.parse(data);

        } catch {

            return {
                summary: data
            };

        }
    }


    /* إذا كانت الاستجابة تحتوي output */

    if (
        data.output !== undefined &&
        data.output !== null
    ) {

        if (
            typeof data.output === "object"
        ) {

            return data.output;
        }

        if (
            typeof data.output === "string"
        ) {

            try {

                return JSON.parse(
                    data.output
                );

            } catch {

                return {
                    summary:
                        data.output
                };

            }
        }
    }


    /* إذا كانت الاستجابة تحتوي json */

    if (
        data.json &&
        typeof data.json === "object"
    ) {

        return data.json;
    }


    return data;
}


/* =====================================================
   SHOW FOLLOW-UP QUESTION
===================================================== */

function showFollowUp(data) {

    waitingForFollowUp =
        true;

    followUpQuestion.textContent =
        data.question ||
        "أحتاج معلومة إضافية حتى أستطيع تقييم الحالة بشكل أدق.";

    followUp.style.display =
        "block";

    followUpInput.value =
        "";

    analyzeBtn.textContent =
        "إرسال الإجابة";

    setTimeout(() => {

        followUpInput.focus();

    }, 100);

}


/* =====================================================
   HIDE FOLLOW-UP
===================================================== */

function hideFollowUp() {

    waitingForFollowUp =
        false;

    followUp.style.display =
        "none";

    followUpInput.value =
        "";

    analyzeBtn.textContent =
        "حلّل الحالة";
}


/* =====================================================
   DISPLAY FINAL RESULT
===================================================== */

function displayResult(rawData) {

    const data =
        normalizeResponse(rawData);


    /*
     * WAEI final structure:
     *
     * {
     *   quality_gate: {...},
     *   final_decision: {
     *      final_decision: {...},
     *      why: [...],
     *      immediate_actions: [...],
     *      awareness_points: [...],
     *      reporting: {...},
     *      user_message: "...",
     *      safety_note: "..."
     *   }
     * }
     */

    const final =
        data.final_decision || {};

    const decision =
        final.final_decision || {};


    /* -------------------------
       Risk Level
    ------------------------- */

    document.getElementById(
        "riskLevel"
    ).textContent =
        translateRisk(
            decision.risk_level
        );


    /* -------------------------
       Risk Score
    ------------------------- */

    document.getElementById(
        "riskScore"
    ).textContent =
        decision.risk_score !== undefined
            ? decision.risk_score
            : "—";


    /* -------------------------
       Compromise Status
    ------------------------- */

    /*
     * Final Decision لا يعيد
     * compromise_status بشكل مستقل.
     *
     * لذلك لا ندعي حدوث اختراق.
     */

    document.getElementById(
        "compromiseStatus"
    ).textContent =
        "لم يتم إثبات الاختراق";


    /* -------------------------
       Summary
    ------------------------- */

    document.getElementById(
        "summary"
    ).textContent =
        decision.summary ||
        "تم تحليل الحالة بناءً على المعلومات المتاحة.";


    /* -------------------------
       WHY
    ------------------------- */

    const why =
        Array.isArray(final.why)
            ? final.why
            : [];


    /* -------------------------
       Indicators
    ------------------------- */

    const indicatorsBox =
        document.getElementById(
            "indicators"
        );

    indicatorsBox.innerHTML =
        "";


    if (why.length === 0) {

        const tag =
            document.createElement(
                "span"
            );

        tag.className =
            "tag";

        tag.textContent =
            "لا توجد مؤشرات إضافية.";

        indicatorsBox.appendChild(
            tag
        );

    } else {

        why.forEach(item => {

            const tag =
                document.createElement(
                    "span"
                );

            tag.className =
                "tag";

            tag.textContent =
                typeof item === "string"
                    ? item
                    : JSON.stringify(item);

            indicatorsBox.appendChild(
                tag
            );

        });

    }


    /* -------------------------
       Facts
    ------------------------- */

    renderList(
        document.getElementById(
            "facts"
        ),
        why
    );


    /* -------------------------
       Immediate Actions
    ------------------------- */

    renderActions(
        document.getElementById(
            "immediateActions"
        ),
        Array.isArray(
            final.immediate_actions
        )
            ? final.immediate_actions
            : []
    );


    /* -------------------------
       Follow-up / Awareness
    ------------------------- */

    renderActions(
        document.getElementById(
            "followUpActions"
        ),
        Array.isArray(
            final.awareness_points
        )
            ? final.awareness_points
            : []
    );


    /* -------------------------
       WAEI Message
    ------------------------- */

    document.getElementById(
        "awareness"
    ).textContent =
        final.user_message ||
        final.safety_note ||
        "كن واعياً، ولا تتخذ أي إجراء قبل التحقق من الجهة الرسمية.";


    /* -------------------------
       Hide Follow-up
    ------------------------- */

    hideFollowUp();


    /* -------------------------
       Show Results
    ------------------------- */

    results.style.display =
        "block";


    /* -------------------------
       Scroll
    ------------------------- */

    setTimeout(() => {

        results.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }, 100);

}


/* =====================================================
   SEND TO WAEI
===================================================== */

async function sendToWAEI(message) {

    const payload = {

        session_id:
            sessionId,

        message:
            message,

        channel:
            waitingForFollowUp
                ? "conversation"
                : detectChannel(message),

        user_exposure:
            selectedExposure,

        has_screenshot:
            Boolean(selectedImage)

    };


    const response =
        await fetch(
            WEBHOOK_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json; charset=UTF-8"
                },

                body:
                    JSON.stringify(payload)
            }
        );


    if (!response.ok) {

        throw new Error(
            "Webhook returned HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    if (!text) {

        throw new Error(
            "WAEI returned an empty response."
        );

    }


    try {

        return JSON.parse(text);

    } catch {

        return text;

    }

}


/* =====================================================
   ANALYZE BUTTON
===================================================== */

analyzeBtn.addEventListener(
    "click",
    async () => {

        let message = "";


        /* -------------------------
           Clear previous error
        ------------------------- */

        errorBox.style.display =
            "none";


        /* -------------------------
           Follow-up answer
        ------------------------- */

        if (waitingForFollowUp) {

            message =
                followUpInput.value.trim();


            if (!message) {

                showError(
                    "اكتبي إجابتك أولاً."
                );

                followUpInput.focus();

                return;
            }

        }


        /* -------------------------
           First message
        ------------------------- */

        else {

            message =
                messageInput.value.trim();


            if (!message) {

                showError(
                    "اكتبي تفاصيل الحالة أولاً."
                );

                messageInput.focus();

                return;
            }

        }


        /* -------------------------
           Loading state
        ------------------------- */

        analyzeBtn.disabled =
            true;

        loading.style.display =
            "block";


        try {

            /*
             * Send request
             */

            const data =
                await sendToWAEI(
                    message
                );


            /*
             * Normalize response
             */

            const normalized =
                normalizeResponse(
                    data
                );


            /*
             * WAEI asks a follow-up
             */

            if (
                normalized.type ===
                "follow_up"
            ) {

                showFollowUp(
                    normalized
                );

                return;
            }


            /*
             * Final result
             */

            displayResult(
                normalized
            );

        }


        catch (error) {

            console.error(
                "WAEI Error:",
                error
            );


            showError(
                "تعذر الاتصال بواعي. تأكدي أن الـ Workflow يعمل في n8n ثم حاولي مرة أخرى."
            );

        }


        finally {

            analyzeBtn.disabled =
                false;

            loading.style.display =
                "none";

        }

    }
);


/* =====================================================
   ENTER KEY FOR FOLLOW-UP
===================================================== */

followUpInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            analyzeBtn.click();

        }

    }
);


/* =====================================================
   INITIAL STATE
===================================================== */

hideFollowUp();
